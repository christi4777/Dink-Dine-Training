        * {
            box-sizing: border-box;

            font-family: 'Arial', sans-serif;

        .container {
            max-width: 1000px;

        // User Management
        class UserManager {
            constructor() {
                this.currentUser = null;
                this.users = this.loadUsers();
            }

            loadUsers() {
                const stored = localStorage.getItem('ddTrainingUsers');
                return stored ? JSON.parse(stored) : [];
            }

            saveUsers() {
                localStorage.setItem('ddTrainingUsers', JSON.stringify(this.users));
            }

            register(name, email) {
                if (this.users.find(u => u.email === email)) {
                    return { success: false, message: 'Email already registered' };
                }

                const user = {
                    id: Date.now().toString(),
                    name,
                    email,
                    points: 0,
                    completedModules: [],
                    completedQuizzes: [],
                    completedScenarios: [],
                    badges: ['🌱 Newbie'],
                    joinedAt: new Date().toISOString(),
                    submissions: []
                };

                this.users.push(user);
                this.saveUsers();
                this.currentUser = user;
                return { success: true, user };
            }

            login(email) {
                const user = this.users.find(u => u.email === email);
                if (user) {
                    this.currentUser = user;
                    return { success: true, user };
                }
                return { success: false, message: 'User not found' };
            }

            logout() {
                this.currentUser = null;
            }

            updateUser(updates) {
                if (!this.currentUser) return;
                
                Object.assign(this.currentUser, updates);
                const index = this.users.findIndex(u => u.id === this.currentUser.id);
                if (index !== -1) {
                    this.users[index] = this.currentUser;
                    this.saveUsers();
                }
            }

            addPoints(points, source) {
                if (!this.currentUser) return;
                
                this.currentUser.points += points;
                this.updateBadges();
                this.saveUsers();
                
                // Show notification to all users
                this.broadcastNotification(`${this.currentUser.name} earned ${points} points for ${source}! 🎉`);
            }

            updateBadges() {
                const points = this.currentUser.points;
                const badges = ['🌱 Newbie'];
                
                if (points >= 100) badges.push('⭐ Rising Star');
                if (points >= 250) badges.push('🏆 Pro Greeter');
                if (points >= 400) badges.push('👑 Master Greeter');
                if (points >= 750) badges.push('🔥 Elite Legend');
                if (this.currentUser.completedModules.length >= trainingModules.length) {
                    badges.push('📚 Training Complete');
                }
                if (this.currentUser.completedQuizzes.length >= quizzes.length) {
                    badges.push('🎯 Quiz Master');
                }
                if (this.currentUser.completedScenarios.length >= 3) {
                    badges.push('🎭 Role Play Pro');
                }
                
                this.currentUser.badges = badges;
            }

            broadcastNotification(message) {
                // Store notification
                const notifications = JSON.parse(localStorage.getItem('ddNotifications') || '[]');
                notifications.push({
                    message,
                    timestamp: Date.now(),
                    read: false
                });

                showNotification(message);
            }

                        ...user,
                        rank: index + 1
                    }));
            }

            } else {
                const name = document.getElementById('auth-name').value;
                const result = userManager.register(name, email);
                if (result.success) {
                    currentView = 'home';
                    currentTab = 'training';
                    showNotification(`Welcome aboard, ${name}! 🎉`);
                    render();
                } else {
                    alert(result.message);
                }
            }
        }

        function logout() {
            userManager.logout();
            currentView = 'auth';
            render();
        }

        function switchTab(tab) {
            currentTab = tab;
            currentModuleId = null;
            currentQuizId = null;
            currentScenarioId = null;
            render();
        }

        function openModule(moduleId) {
            currentModuleId = moduleId;
            render();
        }

        function backToTraining() {
            currentModuleId = null;
            render();
        }

        function submitQuestionnaire(event, moduleId) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const module = trainingModules.find(m => m.id === moduleId);
            
            // Validate word counts for text answers
            let valid = true;
            module.questionnaire.forEach((question, idx) => {
                if (question.type === 'text') {
                    const answer = formData.get(`q${idx}`);
                    const wordCount = answer.trim().split(/\s+/).length;
                    if (wordCount < question.minWords) {
                        alert(`Question ${idx + 1} needs at least ${question.minWords} words. You have ${wordCount}.`);
                        valid = false;
                    }
                }
            });

            if (!valid) return;

            // Validate multiple choice
            let correctCount = 0;
            module.questionnaire.forEach((question, idx) => {
                if (question.type === 'multiple') {
                    const answer = formData.get(`q${idx}`);
                    if (answer === question.correct) {
                        correctCount++;
                    }
                }
            });

            // Save submission
            const submission = {
                moduleId,
                timestamp: new Date().toISOString(),
                answers: Array.from(formData.entries())
            };

            userManager.currentUser.submissions.push(submission);
            userManager.currentUser.completedModules.push(moduleId);
            userManager.addPoints(module.points, module.title);
            
            alert(`Congratulations! You earned ${module.points} points! 🎉`);
            backToTraining();
        }

        function startQuiz(quizId) {
            currentQuizId = quizId;
            currentQuizQuestion = 0;
            quizAnswers = [];
            render();
        }

        function backToQuizzes() {
            currentQuizId = null;
            currentQuizQuestion = 0;
            quizAnswers = [];
            render();
        }

        function answerQuiz(quizId, answer) {
            const quiz = quizzes.find(q => q.id === quizId);
            const question = quiz.questions[currentQuizQuestion];
            
            quizAnswers.push(answer);

            // Visual feedback
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(option => {
                option.disabled = true;
                if (option.textContent.trim() === answer) {
                    if (answer === question.a) {
                        option.classList.add('correct');
                    } else {
                        option.classList.add('incorrect');
                    }
                }
                if (option.textContent.trim() === question.a) {
                    option.classList.add('correct');
                }
            });

            setTimeout(() => {
                if (currentQuizQuestion < quiz.questions.length - 1) {
                    currentQuizQuestion++;
                    render();
                } else {
                    // Calculate score
                    const score = quizAnswers.filter((ans, idx) => ans === quiz.questions[idx].a).length;
                    const percentage = (score / quiz.questions.length * 100);
                    
                    if (percentage >= 80) {
                        userManager.currentUser.completedQuizzes.push(quizId);
                        userManager.addPoints(quiz.points, quiz.title);
                    }
                    
                    // Show results
                    document.getElementById('app').innerHTML = renderQuizResults(quizId, score);
                }
            }, 1500);
        }

        function openScenario(scenarioId) {
            currentScenarioId = scenarioId;
            render();
        }

        function backToRolePlay() {
            currentScenarioId = null;
            render();
        }

        function submitScenario(event, scenarioId) {
            event.preventDefault();
            const form = event.target;
            const response = form.response.value;
            const scenario = rolePlayScenarios.find(s => s.id === scenarioId);

            // Validate word count (rough check)
            const wordCount = response.trim().split(/\s+/).length;
            if (wordCount < 30) {
                alert('Please provide a more detailed response (at least 30 words)');
                return;
            }

            // Save submission
            const submission = {
                scenarioId,
                timestamp: new Date().toISOString(),
                response
            };

            userManager.currentUser.submissions.push(submission);
            userManager.currentUser.completedScenarios.push(scenarioId);
            userManager.addPoints(scenario.points, scenario.title);
            
            alert(`Amazing work! You earned ${scenario.points} points! 🎉`);
            backToRolePlay();
        }

        // Main Render Function
        function render() {
            const app = document.getElementById('app');
            
            if (!userManager.currentUser) {
                app.innerHTML = renderAuth();
                return;
            }

            let content = '';

            if (currentModuleId) {
                content = renderModuleDetail(currentModuleId);
            } else if (currentQuizId) {
                content = renderQuizDetail(currentQuizId);
            } else if (currentScenarioId) {
                content = renderScenarioDetail(currentScenarioId);
            } else {
                switch (currentTab) {
                    case 'training':
                        content = renderTrainingHome();
                        break;
                    case 'quizzes':
                        content = renderQuizzes();
                        break;
                    case 'roleplay':
                        content = renderRolePlay();
                        break;
                    case 'leaderboard':
                        content = renderLeaderboard();
                        break;
                    default:
                        content = renderTrainingHome();
                }
            }

            app.innerHTML = `<div class="container">${content}</div>`;
        }

        // Initialize
        render();
    </script>
</body>
</html>
